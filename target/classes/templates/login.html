
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Rutas Vivas Colombia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/rutas-vivas.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragmentos/menu :: menu}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-2">Iniciar sesión</h1>
                    <p class="text-secondary">Accede a tu cuenta.</p>

                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
                    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="correo" class="form-label">
                                Correo o usuario administrador
                            </label>
                            <input id="correo" name="correo" type="text"
                                   class="form-control" autocomplete="username" required>
                        </div>

                        <div class="mb-3">
                            <label for="clave" class="form-label">Contraseña</label>
                            <input id="clave" name="clave" type="password"
                                   class="form-control" autocomplete="current-password" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Iniciar sesión
                        </button>
                    </form>

                    <p class="mt-3 mb-0 text-center">
                        ¿No tienes cuenta?
                        <a th:href="@{/registro}">Regístrate como turista</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
