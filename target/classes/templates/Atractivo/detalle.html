
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle del atractivo | Rutas Vivas Colombia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/rutas-vivas.css}">
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>

<main class="container py-5">
    <div class="mb-4">
        <a th:href="@{/atractivos}" class="text-decoration-none">
            &larr; Todos los atractivos
        </a>
    </div>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <article class="row g-4 align-items-start">
        <div class="col-lg-7">
            <img class="img-fluid rounded shadow-sm w-100 detalle-imagen"
                 th:if="${atractivo.imagenUrl != null and !#strings.isEmpty(atractivo.imagenUrl)}"
                 th:src="${atractivo.imagenUrl}"
                 th:alt="${atractivo.nombre}">

            <div class="atractivo-sin-imagen detalle-imagen"
                 th:if="${atractivo.imagenUrl == null or #strings.isEmpty(atractivo.imagenUrl)}">
                Imagen no disponible
            </div>
        </div>

        <div class="col-lg-5">
            <p class="text-uppercase text-secondary small mb-2"
               th:text="${atractivo.categoria}">Categoría</p>

            <h1 class="mb-3" th:text="${atractivo.nombre}">
                Nombre del atractivo
            </h1>

            <p class="text-secondary">
                <span th:text="${atractivo.municipio}"></span>
                <span th:if="${atractivo.departamento != null}">, </span>
                <span th:text="${atractivo.departamento}"></span>
            </p>

            <hr>

            <h2 class="h5">Descripción</h2>
            <p class="texto-descripcion"
               th:text="${atractivo.descripcion}">
                Descripción del atractivo.
            </p>

            <div th:if="${atractivo.ubicacion != null and !#strings.isEmpty(atractivo.ubicacion)}">
                <h2 class="h5 mt-4">Ubicación</h2>
                <p th:text="${atractivo.ubicacion}"></p>
            </div>

            <div class="mt-4" th:if="${admin}">
                <a class="btn btn-primary"
                   th:href="@{/atractivos/{id}/editar(id=${atractivo.id})}">
                    Editar atractivo
                </a>
            </div>

            <div class="mt-4" th:unless="${admin}">
                <a class="btn btn-primary" th:href="@{/rutas}">
                    Explorar rutas
                </a>
            </div>
        </div>
    </article>
    <section class="card card-body mt-4" th:if="${!#lists.isEmpty(comentariosCalidad)}">
        <h2 class="h5">Observaciones de calidad publicadas</h2>
        <article class="border-bottom py-2" th:each="c : ${comentariosCalidad}">
            <p class="mb-1" th:text="${c.comentario}"></p>
            <small class="text-secondary" th:text="|Revisión de ${c.autor} · ${c.fecha}|"></small>
        </article>
    </section>
</main>

<footer class="bg-dark text-white py-4 mt-5">
    <div class="container">
        <p class="mb-0">Rutas Vivas Colombia</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/rutas-vivas.js}"></script>
</body>
</html>
