
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atractivos turísticos | Rutas Vivas Colombia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/rutas-vivas.css}">
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>

<main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="mb-2">Atractivos turísticos</h1>
            <p class="text-secondary mb-0">
                Descubre lugares que hacen especial a Colombia.
            </p>
        </div>

        <a class="btn btn-primary" th:href="@{/atractivos/nuevo}"
           th:if="${admin}">
            Registrar atractivo
        </a>
    </div>

    <div class="alert alert-success" role="alert"
         th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-danger" role="alert"
         th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/atractivos}" method="get"
          class="row g-3 mb-4 p-3 bg-light rounded">
        <div class="col-md-5">
            <label for="departamento" class="form-label">Departamento</label>
            <input id="departamento" name="departamento" class="form-control"
                   type="text" placeholder="Ej. Santander"
                   th:value="${departamento}">
        </div>

        <div class="col-md-5">
            <label for="municipio" class="form-label">Municipio</label>
            <input id="municipio" name="municipio" class="form-control"
                   type="text" placeholder="Ej. Barichara"
                   th:value="${municipio}">
        </div>

        <div class="col-md-2 d-flex align-items-end gap-2">
            <button class="btn btn-primary w-100" type="submit">Filtrar</button>
        </div>

        <div class="col-12">
            <a class="btn btn-outline-secondary btn-sm"
               th:href="@{/atractivos}">Limpiar filtros</a>
        </div>
    </form>

    <div class="row g-4" th:if="${!#lists.isEmpty(atractivos)}">
        <div class="col-sm-6 col-lg-4" th:each="atractivo : ${atractivos}">
            <article class="card h-100 shadow-sm">
                <img class="card-img-top atractivo-imagen"
                     th:if="${atractivo.imagenUrl != null and !#strings.isEmpty(atractivo.imagenUrl)}"
                     th:src="${atractivo.imagenUrl}"
                     th:alt="${atractivo.nombre}">

                <div class="atractivo-sin-imagen"
                     th:if="${atractivo.imagenUrl == null or #strings.isEmpty(atractivo.imagenUrl)}">
                    Imagen no disponible
                </div>

                <div class="card-body d-flex flex-column">
                    <h2 class="h5 card-title" th:text="${atractivo.nombre}">
                        Nombre del atractivo
                    </h2>

                    <p class="text-secondary small mb-2">
                        <span th:text="${atractivo.municipio}"></span>
                        <span th:if="${atractivo.departamento != null}">, </span>
                        <span th:text="${atractivo.departamento}"></span>
                    </p>

                    <p class="card-text"
                       th:text="${#strings.abbreviate(atractivo.descripcion != null ? atractivo.descripcion : '', 140)}">
                        Descripción del atractivo.
                    </p>

                    <div class="mt-auto pt-3">
                        <a class="btn btn-outline-primary"
                           th:href="@{/atractivos/{id}(id=${atractivo.id})}">
                            Ver detalles
                        </a>

                        <a class="btn btn-outline-secondary btn-sm"
                           th:if="${admin}"
                           th:href="@{/atractivos/{id}/editar(id=${atractivo.id})}">
                            Editar
                        </a>

                        <form th:if="${admin}"
                              th:action="@{/atractivos/{id}/eliminar(id=${atractivo.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('¿Seguro que deseas eliminar este atractivo?');">
                            <button class="btn btn-outline-danger btn-sm" type="submit">
                                Eliminar
                            </button>
                        </form>
                    </div>
                </div>
            </article>
        </div>
    </div>

    <div class="alert alert-info" th:if="${#lists.isEmpty(atractivos)}">
        No encontramos atractivos con los filtros seleccionados.
    </div>
</main>

<footer class="bg-dark text-white py-4 mt-5">
    <div class="container">
        <p class="mb-0">Rutas Vivas Colombia</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/rutas-vivas.js}"></script>
</body>
</html>
