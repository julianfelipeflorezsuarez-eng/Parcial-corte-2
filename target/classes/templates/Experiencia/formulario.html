
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de experiencia | Rutas Vivas Colombia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/rutas-vivas.css}">
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="h3 mb-4"
                th:text="${experiencia.id == null ? 'Registrar experiencia' : 'Editar experiencia'}">
                Registrar experiencia
            </h1>

            <form th:action="@{/experiencias/guardar}" th:object="${experiencia}"
                  method="post" enctype="multipart/form-data" class="card card-body">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input id="nombre" class="form-control" th:field="*{nombre}" required>
                    <div class="text-danger small" th:errors="*{nombre}"></div>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea id="descripcion" class="form-control" rows="4"
                              th:field="*{descripcion}" required></textarea>
                    <div class="text-danger small" th:errors="*{descripcion}"></div>
                </div>

                <div class="mb-3">
                    <label for="ubicacion" class="form-label">Ubicación</label>
                    <input id="ubicacion" class="form-control" th:field="*{ubicacion}" required>
                    <div class="text-danger small" th:errors="*{ubicacion}"></div>
                </div>

                <div class="mb-3">
                    <label for="responsable" class="form-label">Responsable</label>
                    <input id="responsable" class="form-control" th:field="*{responsable}">
                </div>

                <div class="mb-3">
                    <label for="imagen" class="form-label">Fotografía de la experiencia</label>
                    <input id="imagen" name="imagen" class="form-control" type="file"
                           accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">
                    <div class="form-text">Selecciona una imagen JPG, PNG o WEBP de máximo 5 MB. Al guardar, quedará almacenada y asociada a la experiencia.</div>
                    <div th:if="${errorImagen}" class="text-danger small mt-2" th:text="${errorImagen}"></div>
                </div>
                <div class="mb-3" th:if="${experiencia.imagenUrl != null and !#strings.isEmpty(experiencia.imagenUrl)}">
                    <p class="form-label">Imagen actual</p>
                    <img th:src="${experiencia.imagenUrl}" alt="Imagen actual de la experiencia"
                         class="img-fluid rounded" style="max-height:260px;object-fit:cover">
                    <div class="form-text">Si no seleccionas otra imagen, se conservará la actual.</div>
                </div>

                <div class="mb-3">
                    <label for="rutaId" class="form-label">Ruta relacionada (opcional)</label>
                    <select id="rutaId" class="form-select" th:field="*{rutaId}">
                        <option value="">Sin ruta relacionada</option>
                        <option th:each="r : ${rutas}" th:value="${r.id}" th:text="${r.nombre}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="notasGestor" class="form-label">Notas de gestión cultural (opcional)</label>
                    <textarea id="notasGestor" class="form-control" th:field="*{notasGestor}" rows="3" maxlength="1500" placeholder="Recomendaciones de visita, contexto cultural o información pendiente de confirmar"></textarea>
                    <div class="form-text">Notas internas de apoyo para mantener la experiencia completa y actualizada.</div>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Guardar experiencia</button>
                    <a class="btn btn-outline-secondary" th:href="@{/experiencias}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
