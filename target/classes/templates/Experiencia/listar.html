
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Experiencias culturales | Rutas Vivas Colombia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/rutas-vivas.css}">
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
            <h1>Experiencias culturales</h1>
            <p class="text-secondary mb-0">Conoce tradiciones, sabores y actividades locales.</p>
        </div>
        <a th:if="${puedeGestionar}" class="btn btn-primary" th:href="@{/experiencias/nuevo}">
            Registrar experiencia
        </a>
    </div>

    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="row g-4" th:if="${!#lists.isEmpty(experiencias)}">
        <div class="col-sm-6 col-lg-4" th:each="experiencia : ${experiencias}">
            <article class="card h-100 shadow-sm">
                <img class="card-img-top atractivo-imagen" th:if="${experiencia.imagenUrl != null and !#strings.isEmpty(experiencia.imagenUrl)}" th:src="${experiencia.imagenUrl}" th:alt="${experiencia.nombre}">
                <div class="atractivo-sin-imagen" th:if="${experiencia.imagenUrl == null or #strings.isEmpty(experiencia.imagenUrl)}">Imagen no disponible</div>
                <div class="card-body d-flex flex-column">
                    <h2 class="h5" th:text="${experiencia.nombre}">Nombre</h2>
                    <p class="text-secondary small" th:text="${experiencia.ubicacion}">Ubicación</p>
                    <p th:text="${#strings.abbreviate(experiencia.descripcion != null ? experiencia.descripcion : '', 160)}">
                        Descripción
                    </p>
                    <p class="small" th:if="${experiencia.responsable != null}">
                        <strong>Responsable:</strong>
                        <span th:text="${experiencia.responsable}"></span>
                    </p>

                    <div class="mt-auto d-flex flex-wrap gap-2">
                        <a class="btn btn-outline-primary"
                           th:href="@{/experiencias/{id}(id=${experiencia.id})}">Ver detalle</a>
                        <a th:if="${puedeGestionar}" class="btn btn-outline-secondary"
                           th:href="@{/experiencias/{id}/editar(id=${experiencia.id})}">Editar</a>
                        <form th:if="${puedeGestionar}"
                              th:action="@{/experiencias/{id}/eliminar(id=${experiencia.id})}"
                              method="post"
                              onsubmit="return confirm('¿Eliminar esta experiencia?');">
                            <button type="submit" class="btn btn-outline-danger">Eliminar</button>
                        </form>
                    </div>
                </div>
            </article>
        </div>
    </div>

    <div class="alert alert-info" th:if="${#lists.isEmpty(experiencias)}">
        Todavía no hay experiencias culturales registradas.
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
