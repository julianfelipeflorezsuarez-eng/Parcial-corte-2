
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios y perfiles | Rutas Vivas Colombia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/rutas-vivas.css}">
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>

<main class="container py-5">
    <h1 class="h3 mb-4">Usuarios y perfiles</h1>
    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="table-responsive" th:if="${!#lists.isEmpty(usuarios)}">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Perfil</th>
                <th>Estado</th>
                <th>Guardar cambios</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.nombre}"></td>
                <td th:text="${usuario.correo}"></td>
                <td>
                    <form th:action="@{/admin/usuarios/rol}" method="post"
                          class="d-flex gap-2">
                        <input type="hidden" name="id" th:value="${usuario.id}">
                        <select name="rol" class="form-select form-select-sm">
                            <option value="TURISTA" th:selected="${usuario.rol == 'TURISTA'}">Turista</option>
                            <option value="GUIA" th:selected="${usuario.rol == 'GUIA'}">Guía</option>
                            <option value="GESTOR_CULTURAL"
                                    th:selected="${usuario.rol == 'GESTOR_CULTURAL'}">Gestor cultural</option>
                            <option value="AUDITOR" th:selected="${usuario.rol == 'AUDITOR'}">Auditor</option>
                        </select>
                        <button class="btn btn-sm btn-primary" type="submit">Guardar perfil</button>
                    </form>
                </td>
                <td th:text="${usuario.activo ? 'Activo' : 'Inactivo'}"></td>
                <td>
                    <form th:action="@{/admin/usuarios/estado}" method="post">
                        <input type="hidden" name="id" th:value="${usuario.id}">
                        <input type="hidden" name="activo" th:value="${!usuario.activo}">
                        <button type="submit" class="btn btn-sm"
                                th:classappend="${usuario.activo ? 'btn-outline-danger' : 'btn-outline-success'}"
                                th:text="${usuario.activo ? 'Desactivar' : 'Activar'}">
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="alert alert-info" th:if="${#lists.isEmpty(usuarios)}">
        Aún no hay turistas registrados.
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
