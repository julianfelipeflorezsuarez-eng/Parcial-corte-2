
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de ruta | Rutas Vivas Colombia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/rutas-vivas.css}">
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>

<main class="container py-5">
    <p><a th:href="@{/rutas}">&larr; Volver a rutas</a></p>

    <h1 th:text="${ruta.nombre}">Nombre de ruta</h1>
    <p class="text-secondary">
        <span th:text="${ruta.destino}"></span>
        <span th:if="${ruta.duracion != null}"> · </span>
        <span th:text="${ruta.duracion}"></span>
    </p>
    <p th:text="${ruta.descripcion}"></p>
    <p th:if="${ruta.guia != null and !#strings.isEmpty(ruta.guia)}">
        <strong>Guía:</strong> <span th:text="${ruta.guia}"></span>
    </p>

    <hr>
    <h2 class="h4 mb-3">Paradas de la ruta</h2>

    <ol class="list-group list-group-numbered mb-4"
        th:if="${!#lists.isEmpty(paradas)}">
        <li class="list-group-item" th:each="parada : ${paradas}">
            <img class="img-fluid rounded mb-2" style="max-height:220px; width:100%; object-fit:cover"
                 th:if="${parada.imagenUrl != null and !#strings.isEmpty(parada.imagenUrl)}"
                 th:src="${parada.imagenUrl}" th:alt="${parada.nombre}">
            <div class="atractivo-sin-imagen mb-2" th:if="${parada.imagenUrl == null or #strings.isEmpty(parada.imagenUrl)}">Imagen no disponible para esta parada</div>
            <a th:href="@{/atractivos/{id}(id=${parada.id})}"
               th:text="${parada.nombre}">Atractivo</a>
            <div class="small text-secondary">
                <span th:text="${parada.municipio}"></span>,
                <span th:text="${parada.departamento}"></span>
            </div>
        </li>
    </ol>

    <div class="alert alert-info" th:if="${#lists.isEmpty(paradas)}">
        Esta ruta todavía no tiene atractivos asociados.
    </div>

    <section class="card card-body mb-4" th:if="${!#lists.isEmpty(comentariosCalidad)}">
        <h2 class="h5">Observaciones de calidad publicadas</h2>
        <article class="border-bottom py-2" th:each="c : ${comentariosCalidad}">
            <p class="mb-1" th:text="${c.comentario}"></p>
            <small class="text-secondary" th:text="|Revisión de ${c.autor} · ${c.fecha}|"></small>
        </article>
    </section>

    <a class="btn btn-primary"
       th:href="@{/solicitudes/nueva(rutaId=${ruta.id})}">
        Solicitar información sobre esta ruta
    </a>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
