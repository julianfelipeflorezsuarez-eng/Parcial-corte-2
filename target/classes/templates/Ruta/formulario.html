
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de ruta | Rutas Vivas Colombia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/rutas-vivas.css}">
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="h3 mb-4"
                th:text="${ruta.id == null ? 'Crear ruta' : 'Editar ruta'}">Crear ruta</h1>

            <form th:action="@{/rutas/guardar}" th:object="${ruta}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input id="nombre" class="form-control" th:field="*{nombre}" required>
                    <div class="text-danger small" th:errors="*{nombre}"></div>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea id="descripcion" class="form-control" rows="4"
                              th:field="*{descripcion}" required></textarea>
                    <div class="text-danger small" th:errors="*{descripcion}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="destino" class="form-label">Destino</label>
                        <input id="destino" class="form-control" th:field="*{destino}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="duracion" class="form-label">Duración</label>
                        <input id="duracion" class="form-control" th:field="*{duracion}"
                               placeholder="Ej. 2 días">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="guia" class="form-label">Guía responsable</label>
                    <input id="guia" class="form-control" th:field="*{guia}">
                </div>

                <div class="mb-3">
                    <label for="atractivosIds" class="form-label">Atractivos de la ruta</label>
                    <p class="form-text">Selecciona los atractivos en el orden de visita.</p>
                    <select id="atractivosIds" class="form-select" th:field="*{atractivosIds}" multiple size="8">
                        <option th:each="atractivo : ${atractivos}"
                                th:value="${atractivo.id}"
                                th:text="${atractivo.nombre + ' — ' + atractivo.municipio + ', ' + atractivo.departamento}">
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Guardar ruta</button>
                    <a class="btn btn-outline-secondary" th:href="@{/rutas}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
