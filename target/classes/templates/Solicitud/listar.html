
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solicitudes | Rutas Vivas Colombia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/rutas-vivas.css}">
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>

<main class="container py-5">
    <h1 class="h3 mb-4">Solicitudes de información</h1>

    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="table-responsive" th:if="${!#lists.isEmpty(solicitudes)}">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Solicitante</th>
                <th>Correo</th>
                <th>Ruta</th>
                <th>Fecha de interés</th>
                <th>Participantes</th>
                <th>Mensaje</th>
                <th>Respuesta al turista</th>
                <th>Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="solicitud : ${solicitudes}">
                <td th:text="${solicitud.nombre}"></td>
                <td th:text="${solicitud.contacto}"></td>
                <td>
                    <span th:each="ruta : ${rutas}"
                          th:if="${solicitud.tipoSolicitud != 'EXPERIENCIA' and ruta.id == solicitud.rutaId}"
                          th:text="${ruta.nombre}"></span>
                    <span th:each="experiencia : ${experiencias}"
                          th:if="${solicitud.tipoSolicitud == 'EXPERIENCIA' and experiencia.id == solicitud.experienciaId}"
                          th:text="${experiencia.nombre}"></span>
                </td>
                <td th:text="${solicitud.fechaDeseada}"></td>
                <td th:text="${solicitud.participantes}"></td>
                <td th:text="${solicitud.mensaje != null and !#strings.isEmpty(solicitud.mensaje) ? solicitud.mensaje : 'Sin mensaje adicional'}"></td>
                <td>
                    <p th:text="${solicitud.respuestaGuia != null ? solicitud.respuestaGuia : 'Sin respuesta'}"></p>
                    <form th:action="@{/solicitudes/{id}/responder(id=${solicitud.id})}" method="post" class="d-grid gap-2">
                        <textarea class="form-control form-control-sm" name="respuesta" rows="2" maxlength="1500" required placeholder="Responder al turista" th:text="${solicitud.respuestaGuia}"></textarea>
                        <button class="btn btn-sm btn-outline-success" type="submit">Guardar respuesta</button>
                    </form>
                </td>
                <td th:text="${solicitud.estado}"></td>
                <td>
                    <form th:action="@{/solicitudes/{id}/estado(id=${solicitud.id})}"
                          method="post" class="d-flex gap-2">
                        <select name="estado" class="form-select form-select-sm">
                            <option value="PENDIENTE"
                                    th:selected="${solicitud.estado == 'PENDIENTE'}">Pendiente</option>
                            <option value="ATENDIDA"
                                    th:selected="${solicitud.estado == 'ATENDIDA'}">Atendida</option>
                            <option value="DESCARTADA"
                                    th:selected="${solicitud.estado == 'DESCARTADA'}">Descartada</option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-primary">Guardar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="alert alert-info" th:if="${#lists.isEmpty(solicitudes)}">
        No hay solicitudes registradas.
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
