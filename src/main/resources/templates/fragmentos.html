<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="navegacion" class="navbar navbar-expand-lg navbar-dark navbar-rutas">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Rutas Vivas Colombia</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false"
                aria-label="Mostrar navegación">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/atractivos}">Atractivos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/rutas}">Rutas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/experiencias}">Experiencias</a></li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <span class="text-white" th:if="${session.admin}">
                    Administrador
                </span>

                <form th:if="${session.admin}" th:action="@{/logout}" method="post">
                    <button class="btn btn-outline-light btn-sm" type="submit">
                        Cerrar sesión
                    </button>
                </form>

                <a th:unless="${session.admin}" class="btn btn-light btn-sm"
                   th:href="@{/login}">Iniciar sesión</a>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="mensajes" class="container mt-3">
    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
</div>

<footer th:fragment="pie" class="pie-pagina mt-5">
    <div class="container py-4">
        <p class="mb-1">Rutas Vivas Colombia</p>
        <p class="mb-0">Descubre el patrimonio natural y cultural de Colombia.</p>
    </div>
</footer>

</body>
</html>
