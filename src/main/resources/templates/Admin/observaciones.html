<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Observaciones de calidad | Rutas Vivas Colombia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/rutas-vivas.css}">
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<main class="container py-5">
    <h1 class="h3">Observaciones de calidad</h1>
    <p class="text-secondary">El administrador puede revisar los comentarios registrados por el auditor y su estado de publicación.</p>
    <div class="alert alert-info" th:if="${#lists.isEmpty(comentarios)}">No hay observaciones registradas.</div>
    <article class="card mb-3" th:each="c : ${comentarios}">
        <div class="card-body">
            <div class="d-flex justify-content-between flex-wrap gap-2">
                <h2 class="h5 mb-0" th:text="${c.nombreContenido}">Contenido</h2>
                <span class="badge text-bg-secondary" th:text="${c.tipoContenido}">Tipo</span>
            </div>
            <p class="my-2" th:text="${c.comentario}"></p>
            <p class="small text-secondary mb-2" th:text="|Registrado por ${c.autor} · ${c.fecha}|"></p>
            <span class="badge" th:classappend="${c.publicado ? ' text-bg-success' : ' text-bg-warning'}" th:text="${c.publicado ? 'Aprobado y visible para turistas' : 'Pendiente de aprobación'}"></span>
            <span class="badge text-bg-light" th:text="${c.estado}"></span>
        </div>
    </article>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
