
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta | Rutas Vivas Colombia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/rutas-vivas.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragmentos/menu :: menu}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-2">Crear cuenta</h1>
                    <p class="text-secondary">Regístrate como turista para empezar.</p>

                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                    <form th:action="@{/registro}" th:object="${usuario}" method="post">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input id="nombre" class="form-control" type="text"
                                   th:field="*{nombre}" required>
                            <div class="text-danger small" th:errors="*{nombre}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo electrónico</label>
                            <input id="correo" class="form-control" type="email"
                                   th:field="*{correo}" required>
                            <div class="text-danger small" th:errors="*{correo}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="clave" class="form-label">Contraseña</label>
                            <input id="clave" class="form-control" type="password"
                                   th:field="*{clave}" minlength="8" required>
                            <div class="form-text">Mínimo 8 caracteres.</div>
                            <div class="text-danger small" th:errors="*{clave}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Crear cuenta
                        </button>
                    </form>

                    <p class="mt-3 mb-0 text-center">
                        ¿Ya tienes una cuenta?
                        <a th:href="@{/login}">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
