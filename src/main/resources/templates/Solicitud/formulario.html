
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solicitar información | Rutas Vivas Colombia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/rutas-vivas.css}">
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <h1 class="h3" th:text="${esExperiencia == true ? 'Solicitar esta experiencia' : 'Solicitar información de una ruta'}">Solicitar información</h1>
            <p class="text-secondary" th:if="${ruta != null}"
               th:text="${'Ruta seleccionada: ' + ruta.nombre}"></p>
            <p class="text-secondary" th:if="${experiencia != null}"
               th:text="${'Experiencia seleccionada: ' + experiencia.nombre}"></p>

            <form th:action="@{/solicitudes/guardar}"
                  th:object="${solicitud}" method="post" class="card card-body">
                <input type="hidden" th:field="*{rutaId}">
                <input type="hidden" th:field="*{experienciaId}">
                <input type="hidden" th:field="*{tipoSolicitud}">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre completo</label>
                    <input id="nombre" class="form-control" th:field="*{nombre}" required>
                    <div class="text-danger small" th:errors="*{nombre}"></div>
                </div>

                <div class="mb-3">
                    <label for="contacto" class="form-label">Correo de contacto</label>
                    <input id="contacto" type="email" class="form-control"
                           th:field="*{contacto}" required>
                    <div class="text-danger small" th:errors="*{contacto}"></div>
                </div>

                <div class="mb-3">
                    <label for="fechaDeseada" class="form-label">Fecha de interés</label>
                    <input id="fechaDeseada" type="date" class="form-control"
                           th:field="*{fechaDeseada}" required>
                    <div class="text-danger small" th:errors="*{fechaDeseada}"></div>
                </div>

                <div class="mb-3">
                    <label for="participantes" class="form-label">Número de participantes</label>
                    <input id="participantes" type="number" min="1"
                           class="form-control" th:field="*{participantes}" required>
                    <div class="text-danger small" th:errors="*{participantes}"></div>
                </div>

                <div class="mb-3">
                    <label for="mensaje" class="form-label">¿Qué información necesitas?</label>
                    <textarea id="mensaje" class="form-control" rows="4"
                              th:field="*{mensaje}"
                              placeholder="Escribe tus preguntas sobre la ruta."></textarea>
                </div>

                <div class="text-danger small mb-2" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                <p class="small text-secondary">
                    Tu solicitud será revisada por el responsable. Esto no confirma disponibilidad, precio ni reserva y no realiza pagos.
                    Podrás consultar la respuesta desde “Mis solicitudes”, usando el mismo nombre y correo.
                </p>

                <button type="submit" class="btn btn-primary">Enviar solicitud</button>
            </form>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
