<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de atractivo | Rutas Vivas Colombia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/rutas-vivas.css}">
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="mb-2"
                th:text="${atractivo.id == null ? 'Registrar atractivo' : 'Editar atractivo'}">
                Registrar atractivo
            </h1>

            <p class="text-secondary mb-4">
                Completa la información del destino turístico.
            </p>

            <div th:if="${error}" class="alert alert-danger"
                 th:text="${error}"></div>

            <form th:action="@{/atractivos/guardar}"
                  th:object="${atractivo}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label" for="nombre">Nombre</label>
                    <input class="form-control" id="nombre"
                           type="text" th:field="*{nombre}" required>
                    <div class="text-danger small"
                         th:errors="*{nombre}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="descripcion">Descripción</label>
                    <textarea class="form-control" id="descripcion"
                              rows="4" th:field="*{descripcion}" required></textarea>
                    <div class="text-danger small"
                         th:errors="*{descripcion}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="departamento">Departamento</label>
                        <input class="form-control" id="departamento"
                               type="text" th:field="*{departamento}" required>
                        <div class="text-danger small"
                             th:errors="*{departamento}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="municipio">Municipio</label>
                        <input class="form-control" id="municipio"
                               type="text" th:field="*{municipio}" required>
                        <div class="text-danger small"
                             th:errors="*{municipio}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="categoria">Categoría</label>
                    <input class="form-control" id="categoria"
                           type="text" th:field="*{categoria}" required>
                    <div class="text-danger small"
                         th:errors="*{categoria}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="ubicacion">Ubicación descriptiva</label>
                    <input class="form-control" id="ubicacion"
                           type="text" th:field="*{ubicacion}" required>
                    <div class="text-danger small"
                         th:errors="*{ubicacion}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="imagen">Fotografía del atractivo</label>
                    <input class="form-control" id="imagen" name="imagen"
                           type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">
                    <div class="form-text">Selecciona una imagen JPG, PNG o WEBP de máximo 5 MB. Al guardar, quedará almacenada y asociada al atractivo.</div>
                    <div th:if="${errorImagen}" class="text-danger small mt-2" th:text="${errorImagen}"></div>
                </div>

                <div class="mb-3"
                     th:if="${atractivo.imagenUrl != null and !#strings.isEmpty(atractivo.imagenUrl)}">
                    <p class="form-label">Imagen actual</p>
                    <img th:src="${atractivo.imagenUrl}"
                         alt="Imagen actual del atractivo"
                         class="img-fluid rounded"
                         style="max-height:260px;object-fit:cover">
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" id="publicado"
                           type="checkbox" th:field="*{publicado}">
                    <label class="form-check-label" for="publicado">
                        Publicar este atractivo para los visitantes
                    </label>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-success" type="submit">Guardar atractivo</button>
                    <a class="btn btn-outline-secondary" th:href="@{/atractivos}">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer class="border-top py-4 mt-5">
    <div class="container text-secondary small">
        Rutas Vivas Colombia
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
